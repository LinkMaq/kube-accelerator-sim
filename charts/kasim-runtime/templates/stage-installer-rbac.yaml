apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-stage-installer
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
    simulation.kasim.io/persona: stage-installer
rules:
  - apiGroups: [kwok.x-k8s.io]
    resources: [stages]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-stage-installer
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kasim-runtime.fullname" . }}-stage-installer
subjects:
  - kind: ServiceAccount
    name: {{ include "kasim-runtime.fullname" . }}-stage-installer
    namespace: {{ .Release.Namespace }}

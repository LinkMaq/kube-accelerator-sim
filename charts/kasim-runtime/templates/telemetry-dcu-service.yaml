{{- if .Values.telemetry.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-dcu-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dcu-support
    app.kubernetes.io/component: exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    simulation.kasim.io/runtime-contract: v1alpha1
spec:
  type: ClusterIP
  selector:
    {{- include "kasim-runtime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
  ports:
    - name: metrics
      port: {{ .Values.telemetry.service.port }}
      targetPort: telemetry
{{- end }}

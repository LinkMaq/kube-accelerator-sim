{{- $root := include "kasim-runtime.fullname" . -}}
{{- range $persona := list "controller" "telemetry" "observer" "operator" "kwok" "stage-installer" }}
{{- $valuesKey := $persona -}}
{{- if eq $persona "stage-installer" -}}
{{- $valuesKey = "stageInstaller" -}}
{{- end }}
{{- if or (ne $persona "telemetry") $.Values.telemetry.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $root }}-{{ $persona }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kasim-runtime.labels" $ | nindent 4 }}
    simulation.kasim.io/persona: {{ $persona }}
  {{- with (index $.Values.serviceAccounts $valuesKey).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ or (eq $persona "controller") (eq $persona "telemetry") (eq $persona "kwok") (eq $persona "stage-installer") }}
{{- end }}
{{- end }}

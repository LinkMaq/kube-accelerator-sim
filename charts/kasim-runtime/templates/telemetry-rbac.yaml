{{- if .Values.telemetry.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-telemetry
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
    simulation.kasim.io/persona: telemetry
rules:
  - apiGroups: [simulation.kasim.io]
    resources: [scenarioinstances]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-telemetry
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kasim-runtime.fullname" . }}-telemetry
subjects:
  - kind: ServiceAccount
    name: {{ include "kasim-runtime.fullname" . }}-telemetry
    namespace: {{ .Release.Namespace }}
{{- end }}

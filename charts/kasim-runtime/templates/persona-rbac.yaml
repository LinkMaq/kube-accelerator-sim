apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-observer
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
    simulation.kasim.io/persona: observer
rules:
  - apiGroups: [simulation.kasim.io]
    resources: [scenarioinstances]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-observer
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kasim-runtime.fullname" . }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ include "kasim-runtime.fullname" . }}-observer
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-operator
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
    simulation.kasim.io/persona: operator
rules:
  - apiGroups: [simulation.kasim.io]
    resources: [scenarioinstances]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kasim-runtime.fullname" . }}-operator
  labels:
    {{- include "kasim-runtime.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kasim-runtime.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "kasim-runtime.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}

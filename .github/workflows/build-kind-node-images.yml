name: Build exact-patch kind node images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-kind-node-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        kubernetes:
          - "1.30.14"
          - "1.32.13"
          - "1.33.13"
          - "1.34.10"
          - "1.35.7"
          - "1.36.3"
    steps:
      - name: Install pinned kind
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-kind-builder"
          mkdir -p "${tool_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 \
            --output "${tool_dir}/kind"
          printf '%s  %s\n' \
            50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54 \
            "${tool_dir}/kind" | sha256sum --check -
          chmod 0755 "${tool_dir}/kind"
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Download and verify Kubernetes release artifacts
        id: kubernetes
        shell: bash
        env:
          KUBERNETES_PATCH: ${{ matrix.kubernetes }}
        run: |
          release_url="https://dl.k8s.io/release/v${KUBERNETES_PATCH}"
          archive="${RUNNER_TEMP}/kubernetes-server-linux-amd64.tar.gz"
          checksum_file="${archive}.sha256"
          curl --fail --location --silent --show-error \
            "${release_url}/kubernetes-server-linux-amd64.tar.gz" \
            --output "${archive}"
          curl --fail --location --silent --show-error \
            "${release_url}/kubernetes-server-linux-amd64.tar.gz.sha256" \
            --output "${checksum_file}"
          source_sha256="$(tr -d '[:space:]' < "${checksum_file}")"
          test "${#source_sha256}" -eq 64
          printf '%s  %s\n' "${source_sha256}" "${archive}" | sha256sum --check -
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"
          printf 'source_sha256=%s\n' "${source_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact-patch node image
        id: image
        shell: bash
        env:
          KUBERNETES_ARCHIVE: ${{ steps.kubernetes.outputs.archive }}
          KUBERNETES_PATCH: ${{ matrix.kubernetes }}
        run: |
          image="ghcr.io/linkmaq/kube-accelerator-sim-kind-node:v${KUBERNETES_PATCH}-kind-v0.32.0-amd64"
          kind build node-image \
            "${KUBERNETES_ARCHIVE}" \
            --type=file \
            --arch=amd64 \
            --base-image=docker.io/kindest/base:v20260601-995e8fa5 \
            --image="${image}"
          docker push "${image}"
          digest="$(
            docker image inspect "${image}" \
              --format '{{index .RepoDigests 0}}' |
              awk -F@ '{print $2}'
          )"
          case "${digest}" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'invalid published digest: %s\n' "${digest}" >&2; exit 1 ;;
          esac
          printf 'image=%s\n' "${image}" >> "${GITHUB_OUTPUT}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Write build receipt
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          KUBERNETES_PATCH: ${{ matrix.kubernetes }}
          KUBERNETES_SOURCE_SHA256: ${{ steps.kubernetes.outputs.source_sha256 }}
        run: |
          receipt_dir="${RUNNER_TEMP}/kind-node-receipts"
          mkdir -p "${receipt_dir}"
          jq --null-input \
            --arg schemaVersion "kasim.io/kind-node-build-receipt/v1alpha1" \
            --arg classification "project-built" \
            --arg kubernetes "v${KUBERNETES_PATCH}" \
            --arg kubernetesSourceSHA256 "${KUBERNETES_SOURCE_SHA256}" \
            --arg kind "v0.32.0" \
            --arg kindBinarySHA256 "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54" \
            --arg baseImage "docker.io/kindest/base:v20260601-995e8fa5" \
            --arg image "${IMAGE}" \
            --arg imageDigest "${IMAGE_DIGEST}" \
            --arg architecture "linux/amd64" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sourceRevision "${GITHUB_SHA}" \
            --arg runID "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg builtAt "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: $schemaVersion,
              classification: $classification,
              kubernetes: $kubernetes,
              kubernetesSourceSHA256: $kubernetesSourceSHA256,
              kind: $kind,
              kindBinarySHA256: $kindBinarySHA256,
              baseImage: $baseImage,
              image: ($image + "@" + $imageDigest),
              architecture: $architecture,
              repository: $repository,
              sourceRevision: $sourceRevision,
              runID: $runID,
              runAttempt: $runAttempt,
              builtAt: $builtAt
            }' > "${receipt_dir}/kubernetes-${KUBERNETES_PATCH}.json"

      - name: Upload build receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kind-node-build-receipt-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/kind-node-receipts/kubernetes-${{ matrix.kubernetes }}.json
          if-no-files-found: error
          retention-days: 90

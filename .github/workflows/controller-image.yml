name: Controller image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controller-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push controller image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build date
        id: metadata
        shell: bash
        run: |
          source_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          build_date="$(date --utc --date="@${source_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'build_date=%s\n' "${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/linkmaq/kube-accelerator-sim-controller:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            SOURCE_REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned envtest control plane
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-tools"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.2-0.20260713111223-0f529e22d5c0
          assets="$("${tool_dir}/setup-envtest" use -p path 1.36.2)"
          printf 'KUBEBUILDER_ASSETS=%s\n' "${assets}" >> "${GITHUB_ENV}"

      - name: Verify source
        run: make verify

      - name: Verify generated files
        run: make module-check generate-check

      - name: Build binaries
        run: make build

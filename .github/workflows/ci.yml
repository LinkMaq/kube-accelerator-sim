name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned envtest control plane
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-tools"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.2-0.20260713111223-0f529e22d5c0
          assets="$("${tool_dir}/setup-envtest" use -p path 1.36.2)"
          printf 'KUBEBUILDER_ASSETS=%s\n' "${assets}" >> "${GITHUB_ENV}"

      - name: Verify source
        run: make verify

      - name: Verify generated files
        run: make module-check generate-check

      - name: Build binaries
        run: make build

  kwok-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned kind and kubectl
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-e2e-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 \
            --output "${tool_dir}/kind"
          printf '%s  %s\n' \
            50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54 \
            "${tool_dir}/kind" | sha256sum --check -
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl \
            --output "${tool_dir}/kubectl"
          printf '%s  %s\n' \
            1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82 \
            "${tool_dir}/kubectl" | sha256sum --check -
          chmod 0755 "${tool_dir}/kind" "${tool_dir}/kubectl"
          printf 'KIND_BIN=%s\n' "${tool_dir}/kind" >> "${GITHUB_ENV}"
          printf 'KUBECTL_BIN=%s\n' "${tool_dir}/kubectl" >> "${GITHUB_ENV}"

      - name: Exercise pinned KWOK scheduling lifecycle
        env:
          KASIM_E2E_KWOK: "1"
        run: >-
          go test -v ./test/e2e
          -run TestPinnedKWOKSchedulesAndStartsPod
          -count=1
          -timeout=12m

  dra-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - kubernetes: "1.35"
            node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - kubernetes: "1.36"
            node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned kind and skew-compatible kubectl
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-dra-e2e-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 \
            --output "${tool_dir}/kind"
          printf '%s  %s\n' \
            50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54 \
            "${tool_dir}/kind" | sha256sum --check -
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl \
            --output "${tool_dir}/kubectl"
          printf '%s  %s\n' \
            90f75ea6ecc9ea5633262e1c0b83a40560003b30fc94a04cb099404fcef0c224 \
            "${tool_dir}/kubectl" | sha256sum --check -
          chmod 0755 "${tool_dir}/kind" "${tool_dir}/kubectl"
          printf 'KIND_BIN=%s\n' "${tool_dir}/kind" >> "${GITHUB_ENV}"
          printf 'KUBECTL_BIN=%s\n' "${tool_dir}/kubectl" >> "${GITHUB_ENV}"

      - name: Exercise stable DRA scheduler contract on Kubernetes ${{ matrix.kubernetes }}
        env:
          KASIM_E2E_DRA: "1"
          KASIM_KIND_NODE_IMAGE: ${{ matrix.node_image }}
        run: >-
          go test -v ./test/e2e
          -run TestStableDRASchedulerAllocation
          -count=1
          -timeout=14m

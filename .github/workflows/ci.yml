name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build deterministic browser fixture
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/kasim-ui-fixture" ./internal/tools/uifixture
          printf 'KASIM_UI_FIXTURE_BIN=%s\n' "${RUNNER_TEMP}/kasim-ui-fixture" >> "${GITHUB_ENV}"

      - name: Exercise bilingual evidence-first UI
        run: npm run test:ui

      - name: Retain visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kasim-ui-browser-evidence
          path: test-results/kasim-ui
          if-no-files-found: warn
          retention-days: 30

  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install documentation dependencies
        run: npm ci

      - name: Require documentation for product changes
        if: github.event_name == 'pull_request'
        run: >-
          npm run docs:check-impact --
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Build documentation
        run: npm run docs:build

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned envtest control plane
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-tools"
          mkdir -p "${tool_dir}"
          GOBIN="${tool_dir}" go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.2-0.20260713111223-0f529e22d5c0
          assets="$("${tool_dir}/setup-envtest" use -p path 1.36.2)"
          printf 'KUBEBUILDER_ASSETS=%s\n' "${assets}" >> "${GITHUB_ENV}"

      - name: Install pinned Helm
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-tools"
          archive="${RUNNER_TEMP}/helm-v4.2.3-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c \
            "${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" \
            --strip-components=1 --directory "${tool_dir}" linux-amd64/helm
          printf '%s\n' "${tool_dir}" >> "${GITHUB_PATH}"

      - name: Verify source
        run: make verify

      - name: Verify generated files
        run: make module-check generate-check

      - name: Build binaries
        run: make build

      - name: Package checksummed chart
        run: make chart-package

  controller-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned chart smoke tools
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-chart-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 \
            --output "${tool_dir}/kind"
          printf '%s  %s\n' \
            50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54 \
            "${tool_dir}/kind" | sha256sum --check -
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl \
            --output "${tool_dir}/kubectl"
          printf '%s  %s\n' \
            1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82 \
            "${tool_dir}/kubectl" | sha256sum --check -
          archive="${RUNNER_TEMP}/helm-v4.2.3-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            e9b88b4ee95b18c706839c28d3a0220e5bc470e9cd9262410c90793c45ff8b7c \
            "${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" \
            --strip-components=1 --directory "${tool_dir}" linux-amd64/helm
          chmod 0755 "${tool_dir}/kind" "${tool_dir}/kubectl" "${tool_dir}/helm"
          printf 'KIND_BIN=%s\n' "${tool_dir}/kind" >> "${GITHUB_ENV}"
          printf 'KUBECTL_BIN=%s\n' "${tool_dir}/kubectl" >> "${GITHUB_ENV}"
          printf 'HELM_BIN=%s\n' "${tool_dir}/helm" >> "${GITHUB_ENV}"

      - name: Build controller image
        run: >-
          docker build
          --build-arg VERSION=0.3.0
          --build-arg SOURCE_REVISION=${{ github.sha }}
          --build-arg BUILD_DATE=1970-01-01T00:00:00Z
          --tag kasim-controller:0.3.0
          .

      - name: Verify controller image metadata
        shell: bash
        run: |
          test "$(docker image inspect kasim-controller:0.3.0 --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect kasim-controller:0.3.0 --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "0.3.0"
          test "$(docker image inspect kasim-controller:0.3.0 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          docker run --rm kasim-controller:0.3.0 --version | grep 'kasim-controller 0.3.0'

      - name: Exercise chart install, upgrade, ownership, and uninstall
        env:
          KASIM_E2E_HELM: "1"
          KASIM_CONTROLLER_IMAGE: kasim-controller:0.3.0
        run: >-
          go test -v ./test/e2e
          -run TestRuntimeChartInstallUpgradeUninstall
          -count=1
          -timeout=15m

  kwok-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned kind and kubectl
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-e2e-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 \
            --output "${tool_dir}/kind"
          printf '%s  %s\n' \
            50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54 \
            "${tool_dir}/kind" | sha256sum --check -
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl \
            --output "${tool_dir}/kubectl"
          printf '%s  %s\n' \
            1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82 \
            "${tool_dir}/kubectl" | sha256sum --check -
          chmod 0755 "${tool_dir}/kind" "${tool_dir}/kubectl"
          printf 'KIND_BIN=%s\n' "${tool_dir}/kind" >> "${GITHUB_ENV}"
          printf 'KUBECTL_BIN=%s\n' "${tool_dir}/kubectl" >> "${GITHUB_ENV}"

      - name: Exercise pinned KWOK scheduling lifecycle
        env:
          KASIM_E2E_KWOK: "1"
        run: >-
          go test -v ./test/e2e
          -run TestPinnedKWOKSchedulesAndStartsPod
          -count=1
          -timeout=12m

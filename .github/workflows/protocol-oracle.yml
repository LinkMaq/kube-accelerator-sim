name: Kubelet protocol oracle

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: protocol-oracle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-plugin:
    name: Device Plugin Kubernetes ${{ matrix.kubernetes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.30.14"
            classification: project-built
            node_image: ghcr.io/linkmaq/kube-accelerator-sim-kind-node:v1.30.14-kind-v0.32.0-amd64@sha256:a73107ec2a139b8ced09922eb0c129731eb0f23d0c37f741d038a6def0e39b25
          - kubernetes: "1.36.3"
            classification: project-built
            node_image: ghcr.io/linkmaq/kube-accelerator-sim-kind-node:v1.36.3-kind-v0.32.0-amd64@sha256:91336f2737cf3ae7039c68945de957c66bad889e6db90bf5d3568293f1ab73db
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Authenticate to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned kind and kubectl
        shell: bash
        run: |
          tool_dir="${RUNNER_TEMP}/kasim-protocol-oracle-tools"
          mkdir -p "${tool_dir}"
          curl --fail --location --silent --show-error \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 \
            --output "${tool_dir}/kind"
          printf '%s  %s\n' \
            50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54 \
            "${tool_dir}/kind" | sha256sum --check -
          curl --fail --location --silent --show-error \
            https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl \
            --output "${tool_dir}/kubectl"
          printf '%s  %s\n' \
            90f75ea6ecc9ea5633262e1c0b83a40560003b30fc94a04cb099404fcef0c224 \
            "${tool_dir}/kubectl" | sha256sum --check -
          chmod 0755 "${tool_dir}/kind" "${tool_dir}/kubectl"
          printf 'KIND_BIN=%s\n' "${tool_dir}/kind" >> "${GITHUB_ENV}"
          printf 'KUBECTL_BIN=%s\n' "${tool_dir}/kubectl" >> "${GITHUB_ENV}"

      - name: Build exact test-only oracle image
        shell: bash
        run: |
          oracle_image="kasim-device-plugin-oracle:${GITHUB_SHA}"
          docker build \
            --file test/oracle/deviceplugin/Dockerfile \
            --tag "${oracle_image}" \
            .
          oracle_image_id="$(docker image inspect --format='{{.Id}}' "${oracle_image}")"
          test "${oracle_image_id#sha256:}" != "${oracle_image_id}"
          printf 'KASIM_ORACLE_IMAGE=%s\n' "${oracle_image}" >> "${GITHUB_ENV}"
          printf 'KASIM_ORACLE_IMAGE_ID=%s\n' "${oracle_image_id}" >> "${GITHUB_ENV}"

      - name: Exercise real kubelet Device Plugin protocol
        env:
          KASIM_E2E_PROTOCOL_ORACLE: "1"
          KASIM_KUBERNETES_PATCH: ${{ matrix.kubernetes }}
          KASIM_KIND_NODE_IMAGE: ${{ matrix.node_image }}
          KASIM_NODE_IMAGE_CLASSIFICATION: ${{ matrix.classification }}
          KASIM_PROTOCOL_ORACLE_RECEIPT: ${{ runner.temp }}/protocol-oracle-receipt-${{ matrix.kubernetes }}.json
        run: >-
          go test -v ./test/e2e
          -run TestKubeletDevicePluginProtocolOracle
          -count=1
          -timeout=16m

      - name: Upload protocol oracle receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-oracle-receipt-${{ matrix.kubernetes }}
          path: ${{ runner.temp }}/protocol-oracle-receipt-${{ matrix.kubernetes }}.json
          if-no-files-found: error
          retention-days: 90

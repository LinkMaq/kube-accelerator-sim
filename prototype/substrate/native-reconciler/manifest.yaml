apiVersion: v1
kind: Namespace
metadata:
  name: kas-native-prototype
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: native-reconciler
  namespace: kas-native-prototype
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kas-native-prototype
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kas-native-prototype
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kas-native-prototype
subjects:
  - kind: ServiceAccount
    name: native-reconciler
    namespace: kas-native-prototype
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: native-reconciler
  namespace: kas-native-prototype
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kas-native-prototype
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kas-native-prototype
    spec:
      serviceAccountName: native-reconciler
      containers:
        - name: reconciler
          image: kas-native-prototype:issue-12
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault

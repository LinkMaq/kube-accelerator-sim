apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scenarioinstances.simulation.kasim.io
spec:
  group: simulation.kasim.io
  scope: Cluster
  names:
    plural: scenarioinstances
    singular: scenarioinstance
    kind: ScenarioInstance
    listKind: ScenarioInstanceList
    shortNames:
      - ksi
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Fidelity
          type: string
          jsonPath: .spec.fidelity
        - name: Desired
          type: integer
          jsonPath: .spec.desiredGeneration
        - name: Observed
          type: integer
          jsonPath: .status.observedGeneration
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required:
            - apiVersion
            - kind
            - metadata
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - targetFingerprint
                - creationIdentity
                - fidelity
                - desiredGeneration
                - canonicalScenario
                - revisions
              x-kubernetes-validations:
                - rule: self.targetFingerprint == oldSelf.targetFingerprint
                  message: targetFingerprint is immutable
                - rule: self.creationIdentity == oldSelf.creationIdentity
                  message: creationIdentity is immutable
                - rule: self.fidelity == oldSelf.fidelity
                  message: fidelity is immutable
                - rule: self.desiredGeneration == oldSelf.desiredGeneration || self.desiredGeneration == oldSelf.desiredGeneration + 1
                  message: desiredGeneration may advance by exactly one
                - rule: "self.desiredGeneration == oldSelf.desiredGeneration ? self.revisions == oldSelf.revisions : self.revisions.size() == oldSelf.revisions.size() + 1"
                  message: advancing desiredGeneration appends exactly one revision
                - rule: "self.desiredGeneration == oldSelf.desiredGeneration ? self.canonicalScenario == oldSelf.canonicalScenario : true"
                  message: canonicalScenario changes only with a new logical revision
                - rule: self.revisions.exists(revision, revision.generation == self.desiredGeneration)
                  message: a revision receipt must match desiredGeneration
              properties:
                targetFingerprint:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                creationIdentity:
                  type: string
                  minLength: 1
                  maxLength: 253
                fidelity:
                  type: string
                  enum:
                    - scheduling
                    - dra-control-plane
                desiredGeneration:
                  type: integer
                  format: int64
                  minimum: 1
                canonicalScenario:
                  type: string
                  minLength: 1
                  maxLength: 1048576
                revisions:
                  type: array
                  minItems: 1
                  maxItems: 4096
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - generation
                  x-kubernetes-validations:
                    - rule: self.exists(revision, revision.generation == 1)
                      message: logical revision generation one must be retained
                  items:
                    type: object
                    required:
                      - generation
                      - digest
                      - profiles
                    x-kubernetes-validations:
                      - rule: self == oldSelf
                        message: accepted logical revision receipts are immutable
                    properties:
                      generation:
                        type: integer
                        format: int64
                        minimum: 1
                      digest:
                        type: string
                        pattern: ^sha256:[0-9a-f]{64}$
                      profiles:
                        type: array
                        maxItems: 128
                        items:
                          type: object
                          required:
                            - id
                            - revision
                            - digest
                            - class
                          properties:
                            id:
                              type: string
                              minLength: 1
                              maxLength: 63
                            revision:
                              type: string
                              minLength: 1
                              maxLength: 128
                            digest:
                              type: string
                              pattern: ^sha256:[0-9a-f]{64}$
                            class:
                              type: string
                              enum:
                                - verified
                                - provisional
                                - custom
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                revisionDigest:
                  type: string
                  pattern: ^sha256:[0-9a-f]{64}$
                phase:
                  type: string
                  enum:
                    - Pending
                    - Reconciling
                    - Ready
                    - Failed
                    - Deleting
                pools:
                  type: array
                  maxItems: 1024
                  items:
                    type: object
                    required:
                      - group
                      - pool
                      - requestedTotal
                      - requestedHealthy
                      - observedTotal
                      - observedHealthy
                    properties:
                      group:
                        type: string
                        minLength: 1
                        maxLength: 63
                      pool:
                        type: string
                        minLength: 1
                        maxLength: 63
                      requestedTotal:
                        type: integer
                        format: int64
                        minimum: 0
                      requestedHealthy:
                        type: integer
                        format: int64
                        minimum: 0
                      observedTotal:
                        type: integer
                        format: int64
                        minimum: 0
                      observedHealthy:
                        type: integer
                        format: int64
                        minimum: 0
                inventory:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    required:
                      - apiVersion
                      - kind
                      - count
                    properties:
                      apiVersion:
                        type: string
                        minLength: 1
                        maxLength: 128
                      kind:
                        type: string
                        minLength: 1
                        maxLength: 128
                      count:
                        type: integer
                        format: int32
                        minimum: 0
                diagnostics:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required:
                      - code
                      - message
                      - retryable
                      - revisionAccepted
                      - exitCategory
                    properties:
                      code:
                        type: string
                        minLength: 1
                        maxLength: 128
                      message:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      retryable:
                        type: boolean
                      revisionAccepted:
                        type: boolean
                      exitCategory:
                        type: integer
                        format: int32
                        enum:
                          - 2
                          - 3
                          - 4
                          - 5
                conditions:
                  type: array
                  maxItems: 6
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 1024
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 128
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        enum:
                          - Progressing
                          - Retrying
                          - Overcommitted
                          - OwnershipConflict
                          - CleanupBlocked
                          - FidelitySatisfied
